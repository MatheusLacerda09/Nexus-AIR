<!DOCTYPE html>

<head>

<link rel="icon" type="image/png" sizes="32x32" href="/assets/branding/favicon-32.png?v=2">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/css/style.css">
	<link rel="stylesheet" href="/css/theme-polish.css?v=20261022-aba1">
<link rel="stylesheet" href="/css/auth.css?v=20261022-zbx">
<script>
  
  (function(){
    try{
      if(localStorage.getItem('nexusTheme') === 'dark'){
        document.documentElement.setAttribute('data-theme', 'dark');
      }
      // A paleta escolhida no painel vale também aqui.
      const accent = localStorage.getItem('nexusAccentGlobal1');
      if(['violet','ocean','emerald','sunset','rose'].includes(accent)) document.documentElement.setAttribute('data-accent', accent);
    }catch(e){  }
  })();
</script>
</head>
<body class="auth-body">

<canvas class="topo-bg" aria-hidden="true"></canvas>

<button class="icon-btn theme-toggle-btn auth-theme-toggle" id="themeToggleBtn" type="button" title="Alternar tema" aria-label="Alternar tema claro/escuro">
  <svg class="ic theme-icon theme-icon--moon"><use href="#ic-moon"/></svg>
  <svg class="ic theme-icon theme-icon--sun"><use href="#ic-sun"/></svg>
</button>

<button class="icon-btn auth-sound-toggle" type="button" data-sound-toggle data-music-toggle aria-pressed="true" title="Desativar sons" aria-label="Desativar sons">
  <svg class="ic sound-icon--on" aria-hidden="true"><use href="#ic-volume-on"/></svg>
  <svg class="ic sound-icon--off" aria-hidden="true"><use href="#ic-volume-off"/></svg>
</button>

<svg class="sr-only" aria-hidden="true">
  <symbol id="ic-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" fill="currentColor"/></symbol>
  <symbol id="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.3"/><line x1="12" y1="2.5" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="21.5"/><line x1="4.2" y1="4.2" x2="6" y2="6"/><line x1="18" y1="18" x2="19.8" y2="19.8"/><line x1="2.5" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="21.5" y2="12"/><line x1="4.2" y1="19.8" x2="6" y2="18"/><line x1="18" y1="6" x2="19.8" y2="4.2"/></symbol>
  <symbol id="ic-volume-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></symbol>
  <symbol id="ic-volume-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m16 9 5 6m0-6-5 6"/></symbol>
  <symbol id="ic-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.2" y="5.5" width="17.6" height="13" rx="2.2"/><path d="M4 7l8 6 8-6"/></symbol>
  <symbol id="ic-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M7.5 10.5V7.8a4.5 4.5 0 0 1 9 0v2.7"/></symbol>
  <symbol id="ic-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.8"/></symbol>
  <symbol id="ic-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 3.5l17 17"/><path d="M10.6 5.7A10.6 10.6 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a15 15 0 0 1-3.6 4.3M6.4 6.9A15.3 15.3 0 0 0 2.5 12S6 18.5 12 18.5a10 10 0 0 0 3.3-.56"/><path d="M9.9 9.9a2.8 2.8 0 0 0 3.95 3.95"/></symbol>
  <symbol id="ic-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="ic-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-11"/></symbol>
</svg>

<div class="auth-page">
  <div class="auth-shell">

    <!-- Painel visual roxo -->
    <div class="auth-visual">
      <div class="orbit-wrap" aria-hidden="true">
        <svg class="orbit-svg" viewBox="0 0 400 400">
          <circle class="orbit-ring orbit-ring--spin" cx="200" cy="200" r="150"/>
          <circle class="orbit-ring orbit-ring--spin rev" cx="200" cy="200" r="105"/>
          <line class="orbit-link" x1="200" y1="200" x2="200" y2="60"/>
          <line class="orbit-link" x1="200" y1="200" x2="330" y2="270"/>
          <line class="orbit-link" x1="200" y1="200" x2="70" y2="270"/>
          <line class="orbit-link" x1="200" y1="200" x2="300" y2="120"/>
          <circle class="orbit-node orbit-node--core" cx="200" cy="200" r="9"/>
          <circle class="orbit-node" cx="200" cy="60" r="6"/>
          <circle class="orbit-pulse" cx="200" cy="60" r="6" fill="#fff" opacity=".8"/>
          <circle class="orbit-node" cx="330" cy="270" r="6"/>
          <circle class="orbit-pulse" cx="330" cy="270" r="6" fill="#fff" opacity=".8"/>
          <circle class="orbit-node" cx="70" cy="270" r="6"/>
          <circle class="orbit-pulse" cx="70" cy="270" r="6" fill="#fff" opacity=".8"/>
          <circle class="orbit-node" cx="300" cy="120" r="6"/>
          <circle class="orbit-pulse" cx="300" cy="120" r="6" fill="#fff" opacity=".8"/>
        </svg>
      </div>

      <div class="auth-visual-top">
        <img src="/assets/logo.png" alt="">
        <span>NEXUS AIR</span>
      </div>

      <div class="auth-visual-copy">
        <h2>Bem-vindo de volta.</h2>
        <p>Entre para acompanhar a saúde das suas máquinas, tarefas e alertas em tempo real.</p>
        <a class="btn-ghost fx-ripple" href="/criar-conta">
          Criar uma conta <svg><use href="#ic-arrow"/></svg>
        </a>
      </div>
    </div>

    <!-- Painel do formulário -->
    <div class="auth-form-panel">
      <div class="auth-form-inner">
        <h1 class="auth-title">Entrar</h1>
        <p class="auth-subtitle">Acesse o painel de monitoramento com sua conta Nexus Air.</p>

        <div class="form-alert" id="formAlert" hidden></div>

        <form id="loginForm" novalidate>
          <div class="field reveal-anim" style="--delay:0">
            <label class="field-label" for="email">E-mail</label>
            <div class="field-input">
              <svg class="field-icon"><use href="#ic-mail"/></svg>
              <input type="text" inputmode="email" id="email" name="email" placeholder="voce@empresa.com" autocomplete="email" required>
            </div>
          </div>

          <div class="field reveal-anim" style="--delay:1">
            <label class="field-label" for="senha">Senha</label>
            <div class="field-input">
              <svg class="field-icon"><use href="#ic-lock"/></svg>
              <input type="password" id="senha" name="senha" placeholder="••••••••" autocomplete="current-password" required>
              <button type="button" class="field-toggle-pw fx-ripple" data-toggle-for="senha" aria-label="Mostrar senha">
                <svg><use href="#ic-eye"/></svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-primary btn-block auth-submit-anim fx-ripple fx-tilt" style="--delay:2" id="submitBtn">Entrar</button>
        </form>

        <p class="auth-footer">Ainda não tem conta? <a href="/criar-conta">Cadastre-se</a></p>
        <p class="auth-footer-mobile"><a href="/criar-conta">Criar uma conta →</a></p>
      </div>
    </div>

  </div>
</div>

<script src="/js/sons.js?v=20261022-musica3"></script>

<script src="/js/maquinas.js?v=20261022-cx5"></script>
</body>
</html>
