<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar · Nexus Air</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-body">

<div class="auth-page">
  <div class="auth-card card-anim" style="--delay:0">
    <div class="auth-logo">
      <div class="auth-logo-icon"><img src="/assets/logo.png" alt="Nexus Air"></div>
      <span class="auth-logo-name">Nexus Air</span>
    </div>

    <h1 class="auth-title">Bem-vindo de volta</h1>
    <p class="auth-subtitle">Entre com sua conta para acessar o painel de monitoramento.</p>

    <div class="form-alert" id="formAlert" hidden></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="voce@empresa.com" autocomplete="email" required>
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="••••••••" autocomplete="current-password" required>
      </div>

      <button type="submit" class="btn-primary btn-block" id="submitBtn">Entrar</button>
    </form>

    <p class="auth-footer">Ainda não tem conta? <a href="/cadastro">Cadastre-se</a></p>
  </div>
</div>

<script src="/js/auth.js"></script>
</body>
</html>
